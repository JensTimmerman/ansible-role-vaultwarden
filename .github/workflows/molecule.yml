name: Ansible Molecule
on: [push, pull_request]


jobs:
  molecule:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_VERBOSITY: 3
    steps:
      - uses: actions/checkout@v7
        with:
          path: "${{ github.repository }}"
      - name: molecule
        uses: robertdebock/molecule-action@5.0.2
        with:
          command: test
